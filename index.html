<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" alt="Music Logo" class="logo" />
    <h1 class="app-title">GEETMP3</h1>
  </header>

  <div class="player">
    <h2 id="song-title">Select a Song</h2>
    <p id="song-meta">Artist - Album</p>
    <audio id="audio"></audio>

    <div class="controls">
      <button id="prev">⏮️</button>
      <button id="play">▶️</button>
      <button id="next">⏭️</button>
    </div>

    <input type="range" id="seek" min="0" max="100" value="0" />

    <div class="time-container">
      <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
    </div>

    <div class="volume-container">
      <span id="volumeIcon">🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />
    </div>

    <div class="file-input">
      <input type="file" id="fileInput" multiple accept="audio/*" />
      <button id="addSong">Add to Playlist</button>
    </div>

    <ul id="playlist"></ul>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
